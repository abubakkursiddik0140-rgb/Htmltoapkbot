name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
      with:
accept-sdk-licenses: true
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets and Capacitor Project
        run: |
          mkdir -p web_assets
          cp *.html web_assets/ || true
          cp *.css web_assets/ || true
          cp *.js web_assets/ || true
          cp *.json web_assets/ || true
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "My New Shop" "com.mynewshop.app" --web-dir="web_assets"
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
