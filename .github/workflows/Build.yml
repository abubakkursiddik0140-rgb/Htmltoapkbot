name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-sdk-licenses: true

      - name: Prepare Web Assets and Capacitor Project
        run: |
          mkdir -p web_assets
          cp *.html web_assets/ || true
          cp *.css web_assets/ || true
          cp *.js web_assets/ || true
          cp *.json web_assets/ || true
          cp -r assets web_assets/ || true
          cp -r images web_assets/ || true

          if [ ! -f web_assets/index.html ]; then
            echo "Error: index.html not found in repository root"
            exit 1
          fi

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "My New Shop" "com.mynewshop.app" --web-dir="web_assets"
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
