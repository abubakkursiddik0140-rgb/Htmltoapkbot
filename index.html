<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<title>দোকানের খাতা</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali","Kalpurush",sans-serif;background:#f1f5f4;color:#0f172a;padding-bottom:90px}
header{background:#0f766e;color:#fff;padding:14px 16px 18px;position:sticky;top:0;z-index:5}
header h1{margin:0 0 10px;font-size:20px}
.totals{display:flex;gap:8px}
.totals div{flex:1;background:rgba(255,255,255,.15);border-radius:10px;padding:8px 10px;font-size:12px}
.totals b{display:block;font-size:17px;margin-top:2px}
.search{margin:12px;display:block;width:calc(100% - 24px);padding:12px;border:1px solid #cbd5d1;border-radius:10px;font-size:16px}
.card{background:#fff;margin:8px 12px;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card .n{font-weight:600;font-size:16px}
.card .p{font-size:12px;color:#64748b}
.due{color:#dc2626;font-weight:700}
.adv{color:#16a34a;font-weight:700}
.zero{color:#64748b;font-weight:700}
.fab{position:fixed;right:16px;bottom:16px;background:#0f766e;color:#fff;border:0;border-radius:30px;padding:14px 20px;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.empty{text-align:center;color:#64748b;margin:40px 20px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;align-items:flex-end}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.sheet h2{margin:0 0 12px;font-size:18px}
input,select{width:100%;padding:12px;border:1px solid #cbd5d1;border-radius:10px;font-size:16px;margin-bottom:10px;font-family:inherit}
.row{display:flex;gap:8px}
.btn{flex:1;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:600;color:#fff;font-family:inherit}
.b-g{background:#16a34a}.b-r{background:#dc2626}.b-t{background:#0f766e}.b-x{background:#e2e8f0;color:#0f172a}
.tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef2f1;font-size:14px}
.tx small{color:#64748b;display:block}
.tx button{background:none;border:0;color:#94a3b8;font-size:18px}
.big{font-size:26px;margin:4px 0 12px}
.foot{display:flex;gap:8px;margin:14px 12px}
.foot .btn{font-size:14px;padding:10px}
</style>
</head>
<body>
<header>
  <h1>📒 দোকানের খাতা</h1>
  <div class="totals">
    <div>মোট বাকি<b id="tDue">০</b></div>
    <div>মোট জমা (অগ্রিম)<b id="tAdv">০</b></div>
    <div>কাস্টমার<b id="tCnt">০</b></div>
  </div>
</header>

<input class="search" id="q" placeholder="🔍 নাম বা ফোন দিয়ে খুঁজুন" oninput="render()">
<div id="list"></div>

<div class="foot">
  <button class="btn b-t" onclick="exportData()">⬇ ব্যাকআপ</button>
  <button class="btn b-t" onclick="document.getElementById('imp').click()">⬆ রিস্টোর</button>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
</div>

<button class="fab" onclick="openAdd()">＋ নতুন কাস্টমার</button>

<div class="modal" id="mAdd"><div class="sheet">
  <h2>নতুন কাস্টমার</h2>
  <input id="aName" placeholder="নাম">
  <input id="aPhone" placeholder="ফোন (ঐচ্ছিক)" inputmode="tel">
  <div class="row"><button class="btn b-x" onclick="closeM('mAdd')">বাতিল</button><button class="btn b-t" onclick="addCustomer()">সেভ</button></div>
</div></div>

<div class="modal" id="mCus"><div class="sheet">
  <h2 id="cName"></h2>
  <div class="p" id="cPhone" style="color:#64748b"></div>
  <div class="big" id="cBal"></div>
  <input id="tAmt" type="number" inputmode="decimal" placeholder="টাকার পরিমাণ">
  <input id="tNote" placeholder="নোট (ঐচ্ছিক, যেমন: চাল ২ কেজি)">
  <div class="row">
    <button class="btn b-r" onclick="addTx('baki')">বাকি দিলাম</button>
    <button class="btn b-g" onclick="addTx('joma')">জমা পেলাম</button>
  </div>
  <h3 style="margin:16px 0 4px;font-size:15px">লেনদেনের তালিকা</h3>
  <div id="txs"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn b-x" onclick="delCustomer()">কাস্টমার মুছুন</button>
    <button class="btn b-t" onclick="closeM('mCus');render()">বন্ধ করুন</button>
  </div>
</div></div>

<script>
var KEY="khata_v1",cur=null,db=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("সেভ করা যায়নি")}}
function bn(n){return String(n).replace(/\d/g,function(d){return"০১২৩৪৫৬৭৮৯"[d]})}
function money(n){n=Math.round(n*100)/100;return"৳"+bn(n.toLocaleString("en-US"))}
function bal(c){return c.tx.reduce(function(s,t){return s+(t.type==="baki"?t.amt:-t.amt)},0)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function render(){
  var q=document.getElementById("q").value.trim().toLowerCase(),h="",due=0,adv=0;
  db.forEach(function(c){var b=bal(c);if(b>0)due+=b;else adv+=-b});
  var items=db.filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>-1||(c.phone||"").indexOf(q)>-1});
  items.sort(function(a,b){return bal(b)-bal(a)});
  items.forEach(function(c){
    var b=bal(c),cls=b>0?"due":b<0?"adv":"zero",lbl=b>0?"বাকি":b<0?"জমা":"";
    h+='<div class="card" onclick="openCus(\''+c.id+'\')"><div><div class="n">'+esc(c.name)+'</div><div class="p">'+esc(c.phone||"")+'</div></div><div class="'+cls+'">'+money(Math.abs(b))+' <small>'+lbl+'</small></div></div>';
  });
  document.getElementById("list").innerHTML=h||'<div class="empty">কোনো কাস্টমার নেই।<br>নিচের বাটনে চাপ দিয়ে যোগ করুন।</div>';
  document.getElementById("tDue").textContent=money(due);
  document.getElementById("tAdv").textContent=money(adv);
  document.getElementById("tCnt").textContent=bn(db.length);
}
function openM(id){document.getElementById(id).classList.add("on")}
function closeM(id){document.getElementById(id).classList.remove("on")}
function openAdd(){document.getElementById("aName").value="";document.getElementById("aPhone").value="";openM("mAdd")}
function addCustomer(){
  var n=document.getElementById("aName").value.trim();
  if(!n){alert("নাম লিখুন");return}
  db.push({id:"c"+Date.now(),name:n,phone:document.getElementById("aPhone").value.trim(),tx:[]});
  save();closeM("mAdd");render();
}
function find(id){return db.filter(function(c){return c.id===id})[0]}
function openCus(id){cur=id;drawCus();openM("mCus")}
function drawCus(){
  var c=find(cur);if(!c)return;
  document.getElementById("cName").textContent=c.name;
  document.getElementById("cPhone").textContent=c.phone?"📞 "+c.phone:"";
  var b=bal(c),el=document.getElementById("cBal");
  el.textContent=(b>0?"বাকি: ":b<0?"অগ্রিম জমা: ":"হিসাব মিটে গেছে: ")+money(Math.abs(b));
  el.className="big "+(b>0?"due":b<0?"adv":"zero");
  var h="";
  c.tx.slice().reverse().forEach(function(t){
    h+='<div class="tx"><div>'+(t.type==="baki"?"🔴 বাকি":"🟢 জমা")+' '+money(t.amt)+'<small>'+bn(new Date(t.date).toLocaleDateString("en-GB"))+(t.note?" • "+esc(t.note):"")+'</small></div><button onclick="delTx(\''+t.id+'\')">✕</button></div>';
  });
  document.getElementById("txs").innerHTML=h||'<div class="empty" style="margin:14px">কোনো লেনদেন নেই</div>';
}
function addTx(type){
  var a=parseFloat(document.getElementById("tAmt").value);
  if(!(a>0)){alert("সঠিক টাকার পরিমাণ লিখুন");return}
  find(cur).tx.push({id:"t"+Date.now(),type:type,amt:a,note:document.getElementById("tNote").value.trim(),date:new Date().toISOString()});
  document.getElementById("tAmt").value="";document.getElementById("tNote").value="";
  save();drawCus();
}
function delTx(id){
  if(!confirm("এই লেনদেন মুছবেন?"))return;
  var c=find(cur);c.tx=c.tx.filter(function(t){return t.id!==id});save();drawCus();
}
function delCustomer(){
  if(!confirm("এই কাস্টমার ও তার সব হিসাব মুছে যাবে। নিশ্চিত?"))return;
  db=db.filter(function(c){return c.id!==cur});save();closeM("mCus");render();
}
function exportData(){
  var blob=new Blob([JSON.stringify(db)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="khata-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
}
function importData(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;
      if(confirm("বর্তমান সব ডেটা বদলে এই ব্যাকআপ বসবে। নিশ্চিত?")){db=d;save();render()}
    }catch(x){alert("ফাইলটি সঠিক নয়")}
  };
  r.readAsText(f);e.target.value="";
}
render();
</script>
</body>
</html>
