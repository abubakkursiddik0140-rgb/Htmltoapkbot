<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#006a4e">
<title>সরকারি সেবা</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali","Kalpurush",sans-serif;background:#f2f6f4;color:#0f172a;padding-bottom:30px}
header{background:#006a4e;color:#fff;padding:14px 14px 12px;position:sticky;top:0;z-index:5}
header h1{margin:0 0 10px;font-size:19px}
#q{width:100%;padding:12px;border:0;border-radius:10px;font-size:16px;font-family:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid #c5d6cf;background:#fff;font-size:14px;font-family:inherit}
.tab.on{background:#006a4e;color:#fff;border-color:#006a4e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.item{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.07);position:relative;text-decoration:none;color:inherit;display:block;min-height:84px}
.item .t{font-weight:600;font-size:14.5px;padding-right:22px}
.item .d{font-size:12px;color:#64748b;margin-top:4px;word-break:break-all}
.item .c{display:inline-block;font-size:11px;background:#e6f3ee;color:#006a4e;border-radius:8px;padding:2px 7px;margin-top:6px}
.star{position:absolute;right:6px;top:4px;background:none;border:0;font-size:20px;color:#cbd5d1;padding:4px}
.star.on{color:#f59e0b}
.del{position:absolute;right:6px;bottom:4px;background:none;border:0;font-size:14px;color:#dc2626;padding:4px}
.empty{text-align:center;color:#64748b;margin:40px 20px}
.add{margin:16px 12px 0;background:#fff;border-radius:12px;padding:12px}
.add h3{margin:0 0 8px;font-size:15px}
.add input,.add select{width:100%;padding:11px;border:1px solid #c5d6cf;border-radius:10px;font-size:15px;margin-bottom:8px;font-family:inherit}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#006a4e;color:#fff;font-size:15px;font-weight:600;font-family:inherit}
.note{font-size:12px;color:#64748b;text-align:center;margin:14px 20px 0}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url("images/logo.png") center 55%/80% auto no-repeat;opacity:.10;pointer-events:none}
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hrow h1{margin:0}
.logo{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff}
.contact{margin:16px 12px 0;background:#fff;border-radius:12px;padding:14px;text-align:center}
.contact p{margin:0 0 10px;font-size:14px}
.wa{display:block;background:#25d366;color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:13px;border-radius:10px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <img class="logo" src="images/logo.png" alt="" onerror="this.style.display='none'">
    <h1>🇧🇩 সরকারি সেবা এক জায়গায়</h1>
  </div>
  <input id="q" placeholder="🔍 সেবা বা ওয়েবসাইট খুঁজুন" oninput="render()">
</header>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<div class="add">
  <h3>➕ নিজের লিংক যোগ করুন</h3>
  <input id="nName" placeholder="নাম (যেমন: আমার ইউনিয়ন পরিষদ)">
  <input id="nUrl" placeholder="ওয়েবসাইট (যেমন: example.gov.bd)" inputmode="url">
  <select id="nCat"></select>
  <button class="btn" onclick="addLink()">যোগ করুন</button>
</div>
<div class="contact">
  <p>যে কোনো প্রয়োজনে হোয়াটসঅ্যাপে যোগাযোগ করুন<br><b>০১৮৪৯১০৫০৪৩</b></p>
  <a class="wa" href="https://wa.me/8801849105043" target="_blank" rel="noopener">💬 হোয়াটসঅ্যাপে মেসেজ করুন</a>
</div>
<p class="note">লিংকগুলো সময়ের সাথে বদলাতে পারে। কোনোটা না খুললে সার্চ ইঞ্জিনে সেবার নাম দিয়ে খুঁজে নতুন লিংক যোগ করুন।</p>

<script>
var CATS=["প্রিয়","জাতীয় পোর্টাল","পরিচয় ও নাগরিক সেবা","শিক্ষা","স্বাস্থ্য","ভূমি","কর ও আর্থিক","যোগাযোগ ও পরিবহন","বিদ্যুৎ গ্যাস পানি","চাকরি","আইন ও নিরাপত্তা"];
var BASE=[
["বাংলাদেশ জাতীয় তথ্য বাতায়ন","bangladesh.gov.bd","জাতীয় পোর্টাল"],
["প্রধানমন্ত্রীর কার্যালয়","pmo.gov.bd","জাতীয় পোর্টাল"],
["মন্ত্রিপরিষদ বিভাগ","cabinet.gov.bd","জাতীয় পোর্টাল"],
["জাতীয় সংসদ","parliament.gov.bd","জাতীয় পোর্টাল"],
["পররাষ্ট্র মন্ত্রণালয়","mofa.gov.bd","জাতীয় পোর্টাল"],
["জাতীয় পরিচয়পত্র (এনআইডি)","nidw.gov.bd","পরিচয় ও নাগরিক সেবা"],
["এনআইডি সার্ভিস পোর্টাল","services.nidw.gov.bd","পরিচয় ও নাগরিক সেবা"],
["জন্ম ও মৃত্যু নিবন্ধন","bdris.gov.bd","পরিচয় ও নাগরিক সেবা"],
["ই-পাসপোর্ট","epassport.gov.bd","পরিচয় ও নাগরিক সেবা"],
["ইমিগ্রেশন ও পাসপোর্ট অধিদপ্তর","dip.gov.bd","পরিচয় ও নাগরিক সেবা"],
["শিক্ষা মন্ত্রণালয়","moedu.gov.bd","শিক্ষা"],
["প্রাথমিক ও গণশিক্ষা অধিদপ্তর","dpe.gov.bd","শিক্ষা"],
["শিক্ষা বোর্ড ফলাফল","educationboardresults.gov.bd","শিক্ষা"],
["জাতীয় বিশ্ববিদ্যালয়","nu.ac.bd","শিক্ষা"],
["কারিগরি শিক্ষা বোর্ড","bteb.gov.bd","শিক্ষা"],
["স্বাস্থ্য অধিদপ্তর (ডিজিএইচএস)","dghs.gov.bd","স্বাস্থ্য"],
["স্বাস্থ্য ও পরিবার কল্যাণ মন্ত্রণালয়","mohfw.gov.bd","স্বাস্থ্য"],
["ভূমি মন্ত্রণালয়","minland.gov.bd","ভূমি"],
["ই-নামজারি","mutation.land.gov.bd","ভূমি"],
["ই-পর্চা","eporcha.gov.bd","ভূমি"],
["জাতীয় রাজস্ব বোর্ড (এনবিআর)","nbr.gov.bd","কর ও আর্থিক"],
["ই-টিআইএন","secure.incometax.gov.bd","কর ও আর্থিক"],
["বাংলাদেশ ব্যাংক","bb.org.bd","কর ও আর্থিক"],
["বিআরটিএ (ড্রাইভিং লাইসেন্স, গাড়ি)","brta.gov.bd","যোগাযোগ ও পরিবহন"],
["বাংলাদেশ রেলওয়ে","railway.gov.bd","যোগাযোগ ও পরিবহন"],
["রেলওয়ে ই-টিকেট","eticket.railway.gov.bd","যোগাযোগ ও পরিবহন"],
["ডাক অধিদপ্তর","bdpost.gov.bd","যোগাযোগ ও পরিবহন"],
["বিটিসিএল","btcl.gov.bd","যোগাযোগ ও পরিবহন"],
["বিদ্যুৎ উন্নয়ন বোর্ড (বিপিডিবি)","bpdb.gov.bd","বিদ্যুৎ গ্যাস পানি"],
["ডেসকো","desco.org.bd","বিদ্যুৎ গ্যাস পানি"],
["ডিপিডিসি","dpdc.org.bd","বিদ্যুৎ গ্যাস পানি"],
["ঢাকা ওয়াসা","dwasa.org.bd","বিদ্যুৎ গ্যাস পানি"],
["বাংলাদেশ সরকারি কর্ম কমিশন (বিপিএসসি)","bpsc.gov.bd","চাকরি"],
["সরকারি চাকরির আবেদন (টেলিটক)","teletalk.com.bd","চাকরি"],
["বাংলাদেশ পুলিশ","police.gov.bd","আইন ও নিরাপত্তা"],
["আইন ও বিচার বিভাগ","lawjusticediv.gov.bd","আইন ও নিরাপত্তা"],
["দুর্নীতি দমন কমিশন","acc.org.bd","আইন ও নিরাপত্তা"],
["জাতীয় হেল্পলাইন ৯৯৯","999.gov.bd","আইন ও নিরাপত্তা"]
];
var KEY="sorkari_v1",cat="জাতীয় পোর্টাল",st=load();
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));return s&&s.fav&&s.custom?s:{fav:[],custom:[]}}catch(e){return{fav:[],custom:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function all(){return BASE.map(function(b){return{n:b[0],u:b[1],c:b[2],custom:false}}).concat(st.custom.map(function(c){return{n:c.n,u:c.u,c:c.c,custom:true}}))}
function href(u){return /^https?:\/\//i.test(u)?u:"https://"+u}
function tabs(){
  document.getElementById("tabs").innerHTML=CATS.map(function(c){return'<button class="tab'+(c===cat?" on":"")+'" onclick="setCat(\''+c+'\')">'+(c==="প্রিয়"?"⭐ ":"")+c+'</button>'}).join("");
  var sel=document.getElementById("nCat");
  if(!sel.options.length)CATS.slice(1).forEach(function(c){var o=document.createElement("option");o.value=o.textContent=c;sel.appendChild(o)});
}
function setCat(c){cat=c;tabs();render()}
function render(){
  var q=document.getElementById("q").value.trim().toLowerCase();
  var items=all().filter(function(i){
    if(q)return i.n.toLowerCase().indexOf(q)>-1||i.u.toLowerCase().indexOf(q)>-1;
    return cat==="প্রিয়"?st.fav.indexOf(i.u)>-1:i.c===cat;
  });
  document.getElementById("grid").innerHTML=items.map(function(i){
    var f=st.fav.indexOf(i.u)>-1,k=encodeURIComponent(i.u);
    return'<a class="item" href="'+esc(href(i.u))+'" target="_blank" rel="noopener"><button class="star'+(f?" on":"")+'" onclick="fav(event,\''+k+'\')">'+(f?"★":"☆")+'</button><div class="t">'+esc(i.n)+'</div><div class="d">'+esc(i.u)+'</div><span class="c">'+esc(i.c)+'</span>'+(i.custom?'<button class="del" onclick="delLink(event,\''+k+'\')">মুছুন</button>':"")+'</a>';
  }).join("")||'<div class="empty" style="grid-column:1/3">'+(cat==="প্রিয়"&&!q?"তারকা ☆ চেপে প্রিয় ওয়েবসাইট রাখুন":"কিছু পাওয়া যায়নি")+'</div>';
}
function fav(e,k){
  e.preventDefault();e.stopPropagation();var u=decodeURIComponent(k),i=st.fav.indexOf(u);
  if(i>-1)st.fav.splice(i,1);else st.fav.push(u);save();render();
}
function delLink(e,k){
  e.preventDefault();e.stopPropagation();var u=decodeURIComponent(k);
  if(!confirm("এই লিংক মুছবেন?"))return;
  st.custom=st.custom.filter(function(c){return c.u!==u});st.fav=st.fav.filter(function(x){return x!==u});save();render();
}
function addLink(){
  var n=document.getElementById("nName").value.trim(),u=document.getElementById("nUrl").value.trim().replace(/^https?:\/\//i,"").replace(/\/$/,"");
  if(!n||!u){alert("নাম ও ওয়েবসাইট দুটোই লিখুন");return}
  st.custom.push({n:n,u:u,c:document.getElementById("nCat").value});save();
  document.getElementById("nName").value="";document.getElementById("nUrl").value="";
  cat=document.getElementById("nCat").value;tabs();render();
}
tabs();render();
</script>
</body>
</html>
